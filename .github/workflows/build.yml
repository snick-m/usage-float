name: Build and test
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            qt-host: linux
            qt-arch: linux_gcc_64
          - os: windows-2022
            qt-host: windows
            qt-arch: win64_msvc2022_64
          - os: macos-14
            qt-host: mac
            qt-arch: clang_64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Linux graphics dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl-dev libopengl-dev libegl-dev libxkbcommon-dev libwayland-dev libxcb-cursor0
      - name: Install Qt SDK
        run: |
          python -m pip install aqtinstall==3.3.0
          python -m aqt install-qt ${{ matrix.qt-host }} desktop 6.8.3 ${{ matrix.qt-arch }} --outputdir qt-sdk
      - name: Locate SDK
        shell: python
        run: |
          import os, pathlib
          sdk = next(pathlib.Path('qt-sdk').rglob('Qt6Config.cmake')).resolve().parents[3]
          with open(os.environ['GITHUB_ENV'], 'a') as f:
              f.write(f'USAGE_FLOAT_CI_QT={sdk}\n')
          with open(os.environ['GITHUB_PATH'], 'a') as f:
              f.write(str(sdk / 'bin') + '\n')
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release "-DCMAKE_PREFIX_PATH=${{ env.USAGE_FLOAT_CI_QT }}"
      - name: Build
        run: cmake --build build --config Release --parallel 3
      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure
      - name: Package directory
        run: cmake --install build --config Release --prefix dist
      - uses: actions/upload-artifact@v4
        with:
          name: usage-float-${{ runner.os }}-${{ runner.arch }}
          path: dist/
