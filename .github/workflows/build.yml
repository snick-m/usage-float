name: Build and release
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  desktop:
    name: ${{ matrix.package }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            qt-host: linux
            qt-arch: linux_gcc_64
            package: linux-x86_64
            archives: qtbase qtdeclarative qtsvg qttools qtwayland icu
          - os: windows-2022
            qt-host: windows
            qt-arch: win64_msvc2022_64
            package: windows-x86_64
            archives: qtbase qtdeclarative qtsvg qttools
          - os: macos-14
            qt-host: mac
            qt-arch: clang_64
            package: macos-arm64
            archives: qtbase qtdeclarative qtsvg qttools
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Resolve version and validate release tag
        shell: python
        run: |
          import os, pathlib, re
          cmake = pathlib.Path('CMakeLists.txt').read_text()
          project = re.search(r'project\(UsageFloat VERSION ([0-9.]+)', cmake)[1]
          prerelease = re.search(r'set\(USAGE_FLOAT_PRERELEASE "([^"]*)"\)', cmake)
          if prerelease and prerelease[1]:
              if not re.fullmatch(r'(alpha|beta|rc)\.[1-9][0-9]*', prerelease[1]):
                  raise SystemExit('Invalid prerelease suffix in CMakeLists.txt')
              project += '-' + prerelease[1]
          if os.environ['GITHUB_REF_TYPE'] == 'tag':
              version = os.environ['GITHUB_REF_NAME']
              if version != 'v' + project:
                  raise SystemExit(f'Tag {version} does not match project version {project}')
          else:
              version = 'dev-' + os.environ['GITHUB_SHA'][:8]
          with open(os.environ['GITHUB_ENV'], 'a') as f:
              f.write(f'USAGE_FLOAT_VERSION={version}\n')
      - name: Linux graphics dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl-dev libopengl-dev libegl-dev libxkbcommon-dev libwayland-dev libxcb-cursor0 gjs dbus-daemon libglib2.0-bin
      - uses: actions/cache@v4
        id: qt-cache
        with:
          path: qt-sdk
          key: qt-6.8.3-${{ runner.os }}-${{ runner.arch }}-${{ matrix.qt-arch }}-minimal-v2
      - name: Install Qt SDK
        if: steps.qt-cache.outputs.cache-hit != 'true'
        run: |
          python -m pip install aqtinstall==3.3.0
          python -m aqt install-qt ${{ matrix.qt-host }} desktop 6.8.3 ${{ matrix.qt-arch }} --outputdir qt-sdk --archives ${{ matrix.archives }}
      - name: Locate SDK and absolute install prefix
        shell: python
        run: |
          import os, pathlib
          sdk = next(pathlib.Path('qt-sdk').rglob('Qt6Config.cmake')).resolve().parents[3]
          prefix = pathlib.Path('dist').resolve()
          with open(os.environ['GITHUB_ENV'], 'a') as f:
              f.write(f'USAGE_FLOAT_CI_QT={sdk}\nUSAGE_FLOAT_DIST={prefix}\n')
          with open(os.environ['GITHUB_PATH'], 'a') as f:
              f.write(str(sdk / 'bin') + '\n')
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release "-DCMAKE_PREFIX_PATH=${{ env.USAGE_FLOAT_CI_QT }}"
      - name: Build
        run: cmake --build build --config Release --parallel 3
      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure
      - name: Deploy Qt dependencies
        run: cmake --install build --config Release --prefix "${{ env.USAGE_FLOAT_DIST }}"
      - name: Smoke-test installed application
        run: python scripts/smoke-installed.py --prefix "${{ env.USAGE_FLOAT_DIST }}" --sdk "${{ env.USAGE_FLOAT_CI_QT }}"
      - name: Create downloadable package and checksum
        run: python scripts/package.py --prefix "${{ env.USAGE_FLOAT_DIST }}" --version "${{ env.USAGE_FLOAT_VERSION }}" --platform "${{ matrix.package }}"
      - uses: actions/upload-artifact@v4
        with:
          name: downloads-${{ matrix.package }}
          path: release-assets/*
          if-no-files-found: error
  release:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: desktop
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: downloads-*
          merge-multiple: true
          path: release-assets
      - name: Verify all package checksums
        run: |
          cd release-assets
          for checksum in *.sha256; do sha256sum -c "$checksum"; done
          cat *.sha256 > SHA256SUMS.txt
      - name: Publish verified downloads
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if [[ "$RELEASE_TAG" == *-* ]]; then
            release_flags=(--prerelease --latest=false)
          else
            release_flags=(--prerelease=false --latest)
          fi
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" release-assets/* --clobber
          else
            gh release create "$RELEASE_TAG" release-assets/* --verify-tag --draft --title "Usage Float $RELEASE_TAG" --notes-file packaging/RELEASE_NOTES.md "${release_flags[@]}"
          fi
          gh release edit "$RELEASE_TAG" --draft=false "${release_flags[@]}"
